version: "3.9"

networks:
  pedidos-veloz-net:
    driver: bridge

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: pv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pedidos-veloz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pv-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # painel de administração
    networks:
      - pedidos-veloz-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  estoque:
    build: ./services/estoque
    container_name: pv-estoque
    restart: unless-stopped
    environment:
      - PORT=3003
    networks:
      - pedidos-veloz-net

  pagamentos:
    build: ./services/pagamentos
    container_name: pv-pagamentos
    restart: unless-stopped
    environment:
      - PORT=3002
    networks:
      - pedidos-veloz-net

  pedidos:
    build: ./services/pedidos
    container_name: pv-pedidos
    restart: unless-stopped
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - PAGAMENTOS_URL=http://pagamentos:3002
      - ESTOQUE_URL=http://estoque:3003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pagamentos:
        condition: service_started
      estoque:
        condition: service_started
    networks:
      - pedidos-veloz-net

  api-gateway:
    build: ./services/api-gateway
    container_name: pv-api-gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - PEDIDOS_URL=http://pedidos:3001
      - PAGAMENTOS_URL=http://pagamentos:3002
      - ESTOQUE_URL=http://estoque:3003
    ports:
      - "3000:3000"
    depends_on:
      - pedidos
      - pagamentos
      - estoque
    networks:
      - pedidos-veloz-net

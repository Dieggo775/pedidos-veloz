# Stack de observabilidade separada — subir junto com o compose principal:
#   docker compose -f docker-compose.yml -f observability/docker-compose.observability.yml up -d
version: "3.9"

networks:
  pedidos-veloz-net:
    name: pedidos-veloz_pedidos-veloz-net
    external: true

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: pv-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - pedidos-veloz-net

  grafana:
    image: grafana/grafana:latest
    container_name: pv-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3300:3000"
    networks:
      - pedidos-veloz-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pv-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    networks:
      - pedidos-veloz-net

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: pv-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - jaeger
    networks:
      - pedidos-veloz-net
